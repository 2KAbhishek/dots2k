<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <dir>~/.fonts</dir>

 <!-- Rendering Settings -->
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>

 <!-- Specific Fallback for FiraCode Nerd Font -->
 <match target="pattern">
  <test name="family"><string>FiraCode Nerd Font</string></test>
  <edit name="family" mode="append" binding="weak">
   <string>DejaVu Sans Mono</string>
   <string>Noto Sans Symbols 2</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family"><string>FiraCode Nerd Font Mono</string></test>
  <edit name="family" mode="append" binding="weak">
   <string>DejaVu Sans Mono</string>
   <string>Noto Sans Symbols 2</string>
  </edit>
 </match>

 <!-- Preferred Default Fonts -->
 <alias>
  <family>monospace</family>
  <prefer>
   <family>FiraCode Nerd Font</family>
   <family>DejaVu Sans Mono</family>
   <family>Symbols Nerd Font Mono</family>
   <family>Noto Sans Symbols 2</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>

 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Roboto</family>
   <family>Noto Sans</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>

 <alias>
  <family>serif</family>
  <prefer>
   <family>DejaVu Serif</family>
   <family>Noto Serif</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>

 <alias>
  <family>emoji</family>
  <prefer>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>

 <match>
  <test name="family"><string>Apple Color Emoji</string></test>
  <edit name="family" mode="prepend" binding="strong">
    <string>Noto Color Emoji</string>
  </edit>
 </match>
</fontconfig>
