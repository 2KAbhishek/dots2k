# Fonts
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.0

adjust_line_height  0
adjust_column_width 0

disable_ligatures never
font_features FiraCodeNerdFont-Regular +ss03 +ss04 +ss05 zero
text_composition_strategy platform

# Cursor
cursor                  #1688f0
cursor_text_color       background
cursor_shape            block
cursor_beam_thickness   1.5
cursor_underline_thickness 2.0
cursor_stop_blinking_after 5.0

# Scrollback
scrollback_lines 20000
scrollback_pager $PAGER --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10

# Mouse
mouse_hide_wait 2.0
url_color #1688f0
url_style curly
undercurl_style thin-sparse
open_url_with default
url_prefixes http https file ftp gemini irc gopher mailto news git
detect_urls yes

copy_on_select clipboard
paste_actions quote-urls-at-prompt,confirm-if-large
strip_trailing_spaces smart
focus_follows_mouse yes
pointer_shape_when_grabbed beam
default_pointer_shape arrow
pointer_shape_when_dragging beam
# rectangle_select_modifiers ctrl+alt
# terminal_select_modifiers shift

# Performance Tuning (Ultra-Low Latency & High Refresh)
repaint_delay 6
input_delay 1
sync_to_monitor yes

# Terminal Bell
enable_audio_bell no

# Window Layout & Splits
remember_window_size  yes
initial_window_width  840
initial_window_height 320
enabled_layouts       splits,stack,tall,fat,grid
active_border_color   #1688f0
inactive_border_color #222233
bell_border_color     #ff5a00
hide_window_decorations titlebar-only
macos_option_as_alt yes

# Tab Bar
tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_style powerline
tab_separator " ┇ "
tab_activity_symbol *
tab_title_template "{index}:{title[-8:]}"
active_tab_title_template "[{index}:{title[-8:]}]"

active_tab_foreground   #000000
active_tab_background   #1688f0
active_tab_font_style   bold
inactive_tab_foreground #aaaaaa
inactive_tab_background #35354a
inactive_tab_font_style normal
tab_bar_background      #20203a

# Color Scheme (BWnB Dark Theme)
foreground #dddddd
background #000000
background_opacity 1.0
background_image none
background_image_linear no
dynamic_background_opacity yes
background_tint 0.0
dim_opacity 0.95
selection_foreground #000000
selection_background #1688f0

## Normal Colors
color0 #000000
color1 #e00606
color2 #3ed50a
color3 #f1c200
color4 #0d73cc
color5 #cb1ed1
color6 #0dcdcd
color7 #dddddd

## Bright Colors
color8  #767676
color9  #ff0043
color10 #00f955
color11 #fffd00
color12 #1a8fff
color13 #fd28ff
color14 #14ffff
color15 #ffffff

# Marks
mark1_foreground black
mark1_background #98d3cb
mark2_foreground black
mark2_background #f2dcd3
mark3_foreground black
mark3_background #f274bc

# Advanced & Shell Integration
allow_remote_control no
listen_on none
allow_hyperlinks yes
shell_integration enabled

# Keyboard Shortcuts & Kittens
# Interactive Hints (File paths, git hashes, lines, words)
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>h kitten hints --type hash --program -
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>u kitten hints --type url

# URL opening
map ctrl+shift+o open_url_with_hints
map ctrl+shift+e pass_selection_to_program qutebrowser

# Clipboard (Protected)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Native Splits Management
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+z toggle_layout stack
map ctrl+shift+w close_window

# Split Navigation (Arrow keys & Vim keys)
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+h     neighboring_window left
map ctrl+shift+l     neighboring_window right
map ctrl+shift+k     neighboring_window up
map ctrl+shift+j     neighboring_window down

# Split Resizing
map ctrl+shift+alt+left  resize_window narrower
map ctrl+shift+alt+right resize_window wider
map ctrl+shift+alt+up    resize_window taller
map ctrl+shift+alt+down  resize_window shorter

# Browse scrollback buffer
map ctrl+shift+b show_scrollback
